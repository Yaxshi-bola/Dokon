<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>MMR MOBILE</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Lucide Icons (Premium SVG Icons) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0a0a0f;
      --bg-glass: rgba(255,255,255,0.04);
      --bg-glass-strong: rgba(255,255,255,0.08);
      --border-glass: rgba(255,255,255,0.08);
      --border-glass-strong: rgba(255,255,255,0.15);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.65);
      --text-tertiary: rgba(255,255,255,0.40);
      --accent: #0A84FF;
      --accent-pink: #FF375F;
      --accent-purple: #BF5AF2;
      --nav-height: 85px;
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { display: none; }

    /* ── Glassmorphism ── */
    .glass-card {
      background: linear-gradient(145deg, rgba(30,30,35,0.6) 0%, rgba(15,15,20,0.6) 100%);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--border-glass);
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    /* ── Header ── */
    #appHeader {
      position: sticky; top: 0; z-index: 100;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border-bottom: 1px solid var(--border-glass);
      padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
    }
    .app-logo { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 4px; }
    .app-logo i { color: var(--accent); width: 20px; height: 20px; }
    .header-actions { display: flex; gap: 12px; }
    .header-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-glass); border: 1px solid var(--border-glass); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: var(--text-primary); }
    .header-btn:active { transform: scale(0.92); }
    .notif-badge { position: absolute; top: -2px; right: -2px; width: 16px; height: 16px; background: var(--accent-pink); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: white; border: 2px solid var(--bg-primary); }

    /* ── Navigation ── */
    #bottomNav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-height) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: space-around;
      z-index: 1000;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px; flex: 1; color: var(--text-tertiary); transition: 0.3s; cursor: pointer; }
    .nav-item.active { color: var(--accent); }
    .nav-item.active i { transform: scale(1.1); fill: rgba(10,132,255,0.2); }
    .nav-label { font-size: 11px; font-weight: 600; letter-spacing: 0.2px; }

    /* ── Screens ── */
    .screen { display: none; min-height: 100vh; padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 60px); }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ── Stories ── */
    #storiesRow { display: flex; gap: 14px; padding: 16px 20px 8px; overflow-x: auto; }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex-shrink: 0; }
    .story-avatar-wrap { width: 68px; height: 68px; border-radius: 50%; padding: 2px; background: linear-gradient(45deg, var(--accent-pink), var(--accent-purple), var(--accent)); position: relative; }
    .story-avatar-wrap.seen { background: rgba(255,255,255,0.15); }
    .story-avatar-wrap.add-story { background: var(--bg-glass); border: 1px dashed rgba(255,255,255,0.3); }
    .story-avatar-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--bg-secondary); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    .story-avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
    .story-avatar-wrap::after { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--bg-primary); pointer-events: none; }
    .story-label { font-size: 11px; font-weight: 500; color: var(--text-secondary); max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .add-story-plus { position: absolute; bottom: 0; right: 0; width: 22px; height: 22px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; border: 2px solid var(--bg-primary); z-index: 5; }

    /* ── Post Card ── */
    .post-card { margin: 10px 16px 24px; border-radius: 24px; overflow: hidden; position: relative; }
    .post-header { display: flex; align-items: center; gap: 10px; padding: 16px; }
    .post-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-glass); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .post-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .post-user-info { flex: 1; }
    .post-username { font-size: 15px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 4px; }
    .verified-badge { color: var(--accent); width: 14px; height: 14px; }
    .post-time { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; display: flex; align-items: center; gap: 4px; }
    .post-time i { width: 12px; height: 12px; }
    
    .post-images { position: relative; width: 100%; aspect-ratio: 4/5; background: #000; overflow: hidden; }
    .carousel-track { display: flex; height: 100%; transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94); }
    .carousel-slide { flex-shrink: 0; width: 100%; height: 100%; }
    .carousel-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .post-actions { display: flex; align-items: center; padding: 12px 16px; gap: 16px; }
    .action-btn { display: flex; align-items: center; gap: 6px; cursor: pointer; transition: 0.2s; color: var(--text-primary); }
    .action-btn:active { transform: scale(0.9); }
    .action-btn i { width: 26px; height: 26px; stroke-width: 1.5; }
    .action-btn.liked i { fill: var(--accent-pink); stroke: var(--accent-pink); }
    .action-sep { flex: 1; }
    .action-btn-save i { width: 24px; height: 24px; }
    .action-btn-save.saved i { fill: var(--text-primary); }

    .product-info { padding: 0 16px 16px; }
    .views-count { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-primary); }
    .product-title { font-size: 16px; font-weight: 700; display: inline; }
    .product-desc { font-size: 14px; color: var(--text-secondary); display: inline; margin-left: 6px; }
    .product-price { font-size: 18px; font-weight: 800; color: var(--accent); margin-top: 8px; }
    
    /* ── Contact Admin Button ── */
    .contact-admin-btn {
      margin: 12px 16px 16px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer;
    }
    .contact-admin-btn:active { background: rgba(255,255,255,0.1); }
    .contact-admin-btn i { width: 22px; height: 22px; color: var(--text-primary); }
    .contact-admin-btn .text { font-size: 14px; font-weight: 600; color: var(--text-primary); }

    /* ── Empty States ── */
    .empty-state { padding: 60px 20px; text-align: center; color: var(--text-tertiary); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .empty-state i { width: 48px; height: 48px; color: var(--text-tertiary); opacity: 0.5; }
    .empty-state-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); }

    /* ── Utilities ── */
    .category-pill { padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; background: var(--bg-glass); color: var(--text-secondary); border: 1px solid transparent; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
    .category-pill i { width: 14px; height: 14px; }
    .category-pill.active { background: rgba(255,255,255,0.1); color: white; border-color: rgba(255,255,255,0.2); }
    
    .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* ── Forms & Admin ── */
    #fabBtn { position: fixed; bottom: calc(var(--nav-height) + var(--safe-bottom) + 20px); right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--accent); box-shadow: 0 8px 24px rgba(10,132,255,0.4); display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 500; color: white; }
    #fabBtn.visible { display: flex; }
    .btn-primary { width: 100%; background: var(--accent); color: white; font-size: 16px; font-weight: 600; padding: 16px; border-radius: 16px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    /* Toast */
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px); z-index: 9999; background: rgba(30,30,30,0.95); border: 1px solid rgba(255,255,255,0.1); color: white; font-size: 14px; font-weight: 500; padding: 12px 24px; border-radius: 30px; opacity: 0; transition: 0.4s; pointer-events: none; display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* Admin Panel Overlay */
    #adminPanel { display: none; position: fixed; inset: 0; z-index: 5000; background: var(--bg-primary); overflow-y: auto; }
    #adminPanel.open { display: block; }
  </style>
</head>
<body>

<div id="toast"><i data-lucide="info" style="width:18px;height:18px;"></i> <span id="toastMsg"></span></div>

<!-- Loader -->
<div id="loadingScreen" style="position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;">
  <i data-lucide="diamond" style="width:48px;height:48px;color:var(--accent);"></i>
  <div style="font-size:24px;font-weight:800;letter-spacing:1px;">MMR MOBILE</div>
  <div class="spinner"></div>
</div>

<!-- Header -->
<div id="appHeader" style="display:none;">
  <div class="app-logo"><i data-lucide="diamond"></i> MMR MOBILE</div>
  <div class="header-actions">
    <div class="header-btn" onclick="openSearch()"><i data-lucide="search"></i></div>
    <div class="header-btn" style="position:relative;" onclick="switchScreen('notifications', document.getElementById('nav-notifications'))">
      <i data-lucide="bell"></i>
      <div class="notif-badge" id="notifBadge" style="display:none;">0</div>
    </div>
  </div>
</div>

<div id="app" style="display:none;">

  <!-- 1. FEED -->
  <div id="screen-feed" class="screen active">
    <div id="storiesRow"></div>
    
    <div style="display:flex;gap:10px;padding:4px 20px 16px;overflow-x:auto;scrollbar-width:none;">
      <div class="category-pill active" onclick="filterPosts('all',this)"><i data-lucide="layout-grid"></i> Barchasi</div>
      <div class="category-pill" onclick="filterPosts('product',this)"><i data-lucide="package"></i> Telefonlar</div>
      <div class="category-pill" onclick="filterPosts('news',this)"><i data-lucide="newspaper"></i> Yangiliklar</div>
    </div>

    <div id="postsFeed"><div class="spinner"></div></div>
  </div>

  <!-- 2. SEARCH -->
  <div id="screen-search" class="screen">
    <div style="padding:16px 20px;">
      <div style="position:relative;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:16px;display:flex;align-items:center;padding:0 16px;">
        <i data-lucide="search" style="color:var(--text-tertiary);width:20px;height:20px;"></i>
        <input type="text" placeholder="Qidirish..." style="width:100%;background:transparent;border:none;padding:16px;color:white;outline:none;font-size:15px;" id="searchInput" oninput="onSearch(this.value)" />
      </div>
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- 3. NOTIFICATIONS -->
  <div id="screen-notifications" class="screen">
    <div style="padding:20px;"><div style="font-size:22px;font-weight:700;">Xabarnomalar</div></div>
    <div id="notifList"></div>
  </div>

  <!-- 4. PROFILE -->
  <div id="screen-profile" class="screen">
    <div id="profileContent"></div>
  </div>

</div>

<!-- Navigation -->
<div id="bottomNav" style="display:none;">
  <div class="nav-item active" onclick="switchScreen('feed',this)" id="nav-feed">
    <i data-lucide="home"></i>
    <div class="nav-label">Asosiy</div>
  </div>
  <div class="nav-item" onclick="switchScreen('search',this)" id="nav-search">
    <i data-lucide="search"></i>
    <div class="nav-label">Qidirish</div>
  </div>
  <div class="nav-item" onclick="switchScreen('notifications',this)" id="nav-notifications">
    <i data-lucide="bell"></i>
    <div class="nav-label">Yangiliklar</div>
  </div>
  <div class="nav-item" onclick="switchScreen('profile',this)" id="nav-profile">
    <i data-lucide="user"></i>
    <div class="nav-label">Profil</div>
  </div>
</div>

<!-- Admin FAB -->
<div id="fabBtn" onclick="openAdminPanel()"><i data-lucide="plus"></i></div>

<script>
/* ═══════════════════════════════════════
   SOZLAMALAR
═══════════════════════════════════════ */
const CONFIG = {
  SUPABASE_URL: 'YOUR_SUPABASE_URL', 
  SUPABASE_ANON_KEY: 'YOUR_SUPABASE_ANON_KEY',
  ADMIN_TELEGRAM_ID: '8544023815', // Admin ID kiritildi
  ADMIN_USERNAME: 'yomonboIa',     // '@' belgisisiz
  APP_URL: window.location.origin,
};

/* ═══════════════════════════════════════
   TOZALANGAN BAZA (Bo'sh)
═══════════════════════════════════════ */
let demoPosts = [];
let demoStories = [];
let demoNotifications = [];
let currentFilter = 'all';
let isAdmin = false;

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
const tg = window.Telegram?.WebApp;
let tgUser = null;

if (tg) {
  tg.ready(); tg.expand();
  tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000');
  tgUser = tg.initDataUnsafe?.user || null;
}

// Qat'iy Admin tekshiruvi (Test rejimi yo'q qilindi)
if (tgUser) {
  isAdmin = String(tgUser.id) === String(CONFIG.ADMIN_TELEGRAM_ID);
} else {
  isAdmin = false; // Boshqalar uchun admin yopiq
}

async function init() {
  // Baza ulanishini tekshirish (bu yerda Supabase kodlari ishlashi kerak)
  // ...
  
  if (isAdmin) { document.getElementById('fabBtn').classList.add('visible'); }

  renderFeed();
  renderStories();
  renderNotifications();
  renderProfile();

  setTimeout(() => {
    document.getElementById('loadingScreen').style.opacity = '0';
    setTimeout(() => {
      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('appHeader').style.display = 'flex';
      document.getElementById('app').style.display = 'block';
      document.getElementById('bottomNav').style.display = 'flex';
      lucide.createIcons(); // Ikonkalarni chizish
    }, 300);
  }, 800);
}

/* ═══════════════════════════════════════
   RENDER FEED
═══════════════════════════════════════ */
function renderFeed() {
  const feed = document.getElementById('postsFeed');
  const posts = demoPosts.filter(p => currentFilter === 'all' || p.type === currentFilter);
  
  if (posts.length === 0) {
    feed.innerHTML = `
      <div class="empty-state">
        <i data-lucide="inbox"></i>
        <div class="empty-state-title">Hozircha mahsulotlar yo'q</div>
        <div style="font-size:13px;">Tez orada yangi mahsulotlar qo'shiladi.</div>
      </div>`;
    lucide.createIcons();
    return;
  }

  feed.innerHTML = posts.map(p => `
    <div class="post-card glass-card">
      <div class="post-header">
        <div class="post-avatar"><i data-lucide="user"></i></div>
        <div class="post-user-info">
          <div class="post-username">MMR MOBILE <i data-lucide="check-circle" class="verified-badge"></i></div>
          <div class="post-time"><i data-lucide="clock"></i> Hozir</div>
        </div>
      </div>
      <div class="post-images">
        <img src="${p.images[0]}" style="width:100%;height:100%;object-fit:cover;" />
      </div>
      <div class="post-actions">
        <div class="action-btn" onclick="showToast('Hozircha layk bosish o\\'chirilgan')"><i data-lucide="heart"></i></div>
        <div class="action-btn"><i data-lucide="message-circle"></i></div>
        <div class="action-btn" onclick="sharePost(${p.id})"><i data-lucide="send"></i></div>
        <div class="action-sep"></div>
        <div class="action-btn action-btn-save"><i data-lucide="bookmark"></i></div>
      </div>
      <div class="product-info">
        <div class="views-count">0 marta ko'rildi</div>
        <div><span class="product-title">${p.title}</span><span class="product-desc">${p.description}</span></div>
        <div class="product-price">${p.price || ''}</div>
      </div>
      <div class="contact-admin-btn" onclick="contactAdmin('${p.title}')">
        <i data-lucide="message-square"></i>
        <div class="text">Adminga murojaat qilish</div>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
}

/* ═══════════════════════════════════════
   STORIES & NOTIFICATIONS
═══════════════════════════════════════ */
function renderStories() {
  const row = document.getElementById('storiesRow');
  if (demoStories.length === 0 && !isAdmin) {
    row.style.display = 'none'; // Obunachilarga bo'sh joy ko'rinmaydi
    return;
  }
  row.style.display = 'flex';
  let html = '';
  if (isAdmin) {
    html += `
      <div class="story-item" onclick="showToast('Story qo\\'shish paneli')">
        <div class="story-avatar-wrap add-story">
          <div class="story-avatar-inner"><i data-lucide="camera" style="color:var(--text-tertiary);"></i></div>
          <div class="add-story-plus"><i data-lucide="plus" style="width:14px;"></i></div>
        </div>
        <span class="story-label">Qo'shish</span>
      </div>`;
  }
  // Boshqa stories bo'lsa render qilinadi...
  row.innerHTML = html;
  lucide.createIcons();
}

function renderNotifications() {
  const el = document.getElementById('notifList');
  if (demoNotifications.length === 0) {
    el.innerHTML = `
      <div class="empty-state" style="margin-top:40px;">
        <i data-lucide="bell-off"></i>
        <div class="empty-state-title">Yangi xabarnomalar yo'q</div>
      </div>`;
    lucide.createIcons();
    return;
  }
  // Agar xabarnoma bo'lsa bu yerda chiqadi
}

/* ═══════════════════════════════════════
   PROFILE
═══════════════════════════════════════ */
function renderProfile() {
  const el = document.getElementById('profileContent');
  const name = tgUser ? `${tgUser.first_name || ''} ${tgUser.last_name || ''}`.trim() : 'Mehmon';
  
  el.innerHTML = `
    <div style="padding:40px 20px;text-align:center;">
      <div style="width:90px;height:90px;border-radius:50%;background:var(--bg-glass);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;">
        <i data-lucide="user" style="width:40px;height:40px;color:var(--text-tertiary);"></i>
      </div>
      <div style="font-size:22px;font-weight:700;">${name}</div>
      <div style="color:var(--text-secondary);margin-top:4px;">Xush kelibsiz!</div>
      
      <div style="margin-top:30px;background:var(--bg-glass);border:1px solid var(--border-glass);border-radius:16px;padding:16px;text-align:left;">
        <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-glass);" onclick="contactAdmin('Umumiy savol')">
          <i data-lucide="help-circle" style="color:var(--text-secondary);"></i>
          <span style="flex:1;">Yordam kerakmi?</span>
          <i data-lucide="chevron-right" style="color:var(--text-tertiary);"></i>
        </div>
      </div>
    </div>
  `;
  lucide.createIcons();
}

/* ═══════════════════════════════════════
   ACTIONS
═══════════════════════════════════════ */
function contactAdmin(productName) {
  let text = productName ? `Salom! Ushbu mahsulot bo'yicha yozmoqdaman: ${productName}` : "Salom! Do'koningiz bo'yicha savolim bor edi.";
  const tgUrl = `https://t.me/${CONFIG.ADMIN_USERNAME}?text=${encodeURIComponent(text)}`;
  
  if (tg && tg.openTelegramLink) {
    tg.openTelegramLink(tgUrl); // Ilova ichida ochish
  } else {
    window.location.href = tgUrl; // Fallback
  }
}

function sharePost(id) {
  showToast('🔗 Havola nusxalandi');
}

function filterPosts(type, el) {
  currentFilter = type;
  document.querySelectorAll('.category-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderFeed();
}

function switchScreen(name, el) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');
  if(el) el.classList.add('active');
  document.getElementById('appHeader').style.display = name === 'feed' ? 'flex' : 'none';
  window.scrollTo(0,0);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function openAdminPanel() {
  if(!isAdmin) return;
  showToast('Admin paneli ochilmoqda...');
  // Asl kodning admin qismi shu yerda chaqiriladi
}

// Boshlash
init();
</script>
</body>
